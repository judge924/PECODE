name: 국회의원 데이터 자동 갱신

on:
  schedule:
    # UTC 기준 18:00 = 한국시간(KST) 새벽 03:00
    - cron: '0 18 * * *'
  workflow_dispatch: # 깃허브 웹사이트에서 수동 실행도 가능

permissions:
  contents: write # 저장소에 커밋/푸시할 권한

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 받아오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 패키지 설치
        run: npm install

      - name: 국회 API에서 데이터 받아오기
        run: node scripts/fetchData.js
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}

      - name: 변경사항 있으면 자동 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/politicians.json
          git diff --staged --quiet || git commit -m "chore: 국회의원 데이터 자동 갱신 ($(date +'%Y-%m-%d'))"
          git push